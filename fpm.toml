name = "constituf"
version = "VERSION"
description = "Scientific constitutive modeling in modern Fortran"
license = "Apache-2.0"
author = "Seyed Ali Ghasemi"
maintainer = "info@gha3mi.com"
copyright = "Copyright 2026 Seyed Ali Ghasemi"
homepage = "https://gha3mi.github.io/ConstituF/"
categories = ["science"]
keywords = [
    "fortran",
    "scientific-computing",
    "constitutive-modeling",
    "continuum-mechanics",
]

[build]
auto-executables = false
auto-examples = false
auto-tests = true

[library]
source-dir = "src"

[features]
baseline.gfortran.flags = "-ffree-line-length-none -Wall -Wextra -Wimplicit-interface -Wno-unused-dummy-argument -Wno-integer-division -Werror"
debug.gfortran.flags = "-O0 -g -fcheck=all -fbacktrace"
release.gfortran.flags = "-O3"

baseline.ifx.flags = "-warn all -warn errors -standard-semantics -fp-model=precise -diag-disable=5423"
debug.ifx.flags = "-O0 -g -check all -check noarg_temp_created -traceback -fpe3"
release.ifx.flags = "-O3"

real32.preprocess.cpp.macros = ["CONSTITUF_REAL32"]
real128.preprocess.cpp.macros = ["CONSTITUF_REAL128"]

fpe.gfortran.flags = "-finit-real=snan -ffpe-trap=invalid,zero,overflow"
fpe.ifx.flags = "-init=snan -init=arrays -fpe0"

[profiles]
default = ["baseline"]
debug = ["debug"]
release = ["release"]
debug-fpe = ["baseline", "debug", "fpe"]
debug-real32 = ["baseline", "debug", "real32"]
release-real32 = ["baseline", "release", "real32"]
debug-real128 = ["baseline", "debug", "real128"]
release-real128 = ["baseline", "release", "real128"]

[extra.fortitude.check]
select = ["C", "E", "S"]
ignore = ["S001", "S901", "S902"]

[extra.ford]
project = "ConstituF"
author = "Seyed Ali Ghasemi"
email = "info@gha3mi.com"
github = "https://github.com/gha3mi"
project_github = "https://github.com/gha3mi/ConstituF"
summary = "Extensible constitutive models and optional analytical sensitivities."
license = "Apache-2.0"
year = "2026"
src_dir = ["src"]
page_dir = "docs/pages"
media_dir = "docs/assets"
favicon = "docs/assets/brand/constituf-favicon.png"
css = "docs/assets/constituf.css"
html_template_dir = ["docs/templates"]
output_dir = "docs/ford"
graph = true
show_proc_parent = true
display = ["public", "protected"]
source = true
sort = "permission-alpha"

[[executable]]
name = "benchmark_annulus"
source-dir = "benchmark"
main = "benchmark_annulus_main.f90"

[executable.dependencies]
forcolormap = { git = "https://github.com/vmagnin/forcolormap.git", tag = "v1.0" }

[[executable]]
name = "benchmark_cavity3d"
source-dir = "benchmark"
main = "benchmark_cavity3d_main.f90"

[executable.dependencies]
forcolormap = { git = "https://github.com/vmagnin/forcolormap.git", tag = "v1.0" }

